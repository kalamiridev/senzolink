services:
  fusionsolar-mqtt:
    build:
      context: .
    environment:
      FUSIONSOLAR_USERNAME: ${FUSIONSOLAR_USERNAME:?FUSIONSOLAR_USERNAME is required}
      FUSIONSOLAR_PASSWORD: ${FUSIONSOLAR_PASSWORD:?FUSIONSOLAR_PASSWORD is required}
      FUSIONSOLAR_SUBDOMAIN: ${FUSIONSOLAR_SUBDOMAIN:?FUSIONSOLAR_SUBDOMAIN is required}
      FUSIONSOLAR_PLANT_ID: ${FUSIONSOLAR_PLANT_ID:?FUSIONSOLAR_PLANT_ID is required}
      MQTT_HOST: ${MQTT_HOST:?MQTT_HOST is required}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-fusionsolar/state}
      MQTT_QOS: ${MQTT_QOS:-0}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-false}
      MQTT_TLS_CA_CERT: ${MQTT_TLS_CA_CERT:-}
      HA_DISCOVERY_ENABLED: ${HA_DISCOVERY_ENABLED:-true}
      HA_DISCOVERY_PREFIX: ${HA_DISCOVERY_PREFIX:-homeassistant}
      HA_DISCOVERY_NODE_ID: ${HA_DISCOVERY_NODE_ID:-fusionsolar}
      HA_DEVICE_ID: ${HA_DEVICE_ID:-}
      POLL_INTERVAL: ${POLL_INTERVAL:-180}
    restart: unless-stopped
