services:
  fusionsolar-mqtt:
    container_name: fusionsolar-mqtt-test
    image: senzolink/fusionsolar-mqtt:1.0.1
    environment:
      FUSIONSOLAR_USERNAME: ${FUSIONSOLAR_USERNAME:?FUSIONSOLAR_USERNAME is required}
      FUSIONSOLAR_PASSWORD: ${FUSIONSOLAR_PASSWORD:?FUSIONSOLAR_PASSWORD is required}
      FUSIONSOLAR_SUBDOMAIN: ${FUSIONSOLAR_SUBDOMAIN:?FUSIONSOLAR_SUBDOMAIN is required}
      MQTT_HOST: mqtt
      MQTT_TOPIC: fusionsolar/state
    depends_on:
      mqtt:
        condition: service_started
    restart: unless-stopped

  mqtt:
    container_name: mqtt-test
    image: eclipse-mosquitto:2
    command:
      - /bin/sh
      - -ec
      - |
        printf '%s\n' 'listener 1883' 'allow_anonymous true' 'persistence false' > /tmp/mosquitto.conf
        exec mosquitto -c /tmp/mosquitto.conf
