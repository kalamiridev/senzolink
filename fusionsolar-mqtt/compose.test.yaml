services:
  fusionsolar-mqtt:
    container_name: fusionsolar-mqtt-test
    image: senzolink/fusionsolar-mqtt:1.0.1
    environment:
      FUSIONSOLAR_USERNAME: ${FUSIONSOLAR_USERNAME:?FUSIONSOLAR_USERNAME is required}
      FUSIONSOLAR_PASSWORD: ${FUSIONSOLAR_PASSWORD:?FUSIONSOLAR_PASSWORD is required}
      FUSIONSOLAR_SUBDOMAIN: ${FUSIONSOLAR_SUBDOMAIN:?FUSIONSOLAR_SUBDOMAIN is required}
      FUSIONSOLAR_PLANT_NAME: ${FUSIONSOLAR_PLANT_NAME:-}
      MQTT_HOST: mqtt
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-fusionsolar/state}
      MQTT_QOS: ${MQTT_QOS:-0}
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_TLS_ENABLED: "false"
      HA_DISCOVERY_ENABLED: ${HA_DISCOVERY_ENABLED:-true}
      HA_DISCOVERY_NODE_ID: ${HA_DISCOVERY_NODE_ID:-fusionsolar}
      MQTT_CONNECT_TIMEOUT: ${MQTT_CONNECT_TIMEOUT:-30}
      MQTT_PUBLISH_TIMEOUT: ${MQTT_PUBLISH_TIMEOUT:-30}
      POLL_INTERVAL: ${POLL_INTERVAL:-180}
      TZ: ${TZ:-}
      FUSIONSOLAR_PAUSE_START: ${FUSIONSOLAR_PAUSE_START:-}
      FUSIONSOLAR_PAUSE_END: ${FUSIONSOLAR_PAUSE_END:-}
    depends_on:
      mqtt:
        condition: service_started
    restart: unless-stopped

  mqtt:
    container_name: fusionsolar-mqtt-test-mqtt
    image: eclipse-mosquitto:2
    command:
      - /bin/sh
      - -ec
      - |
        printf '%s\n' 'listener 1883' 'allow_anonymous true' 'persistence false' > /tmp/mosquitto.conf
        exec mosquitto -c /tmp/mosquitto.conf
