name: FusionSolar MQTT

on:
  push:
    paths:
      - fusionsolar-mqtt/**
      - .github/workflows/fusionsolar-mqtt.yml
  pull_request:
    paths:
      - fusionsolar-mqtt/**
      - .github/workflows/fusionsolar-mqtt.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fusionsolar-mqtt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip check
      - run: python -m pip install pip-audit && python -m pip_audit -r requirements.lock
      - run: docker build --tag fusionsolar-mqtt:test .
